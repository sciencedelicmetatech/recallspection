<svg width="800" height="240" viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Recallspection banner eigengrau">
  <defs>
    <!-- subtle grain -->
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0 0.03"/>
        <feFuncG type="table" tableValues="0 0.03"/>
        <feFuncB type="table" tableValues="0 0.03"/>
      </feComponentTransfer>
    </filter>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <!-- bg eigengrau -->
  <rect width="800" height="240" fill="#16161D"/>
  <rect x="0.5" y="0.5" width="799" height="239" fill="none" stroke="#2A2A35" stroke-width="1"/>

  <!-- subtle grid lines -->
  <g stroke="#1E1E26" stroke-width="0.5" opacity="0.8">
    <line x1="0" y1="48" x2="800" y2="48"/>
    <line x1="0" y1="192" x2="800" y2="192"/>
    <line x1="200" y1="0" x2="200" y2="240"/>
    <line x1="600" y1="0" x2="600" y2="240"/>
  </g>

  <!-- left top badge -->
  <g class="mono">
    <text x="24" y="30" font-size="11" letter-spacing="0.08em" fill="#8A8880">▣ RECALLSPECTION v3.1 — LEDGER /data PERSISTENT — ANCHOR S3 COMPLIANCE</text>
  </g>

  <!-- main title -->
  <g class="mono">
    <text x="24" y="98" font-size="44" font-weight="700" letter-spacing="-0.02em" fill="#E8E6E1">Recallspection</text>
    <text x="368" y="98" font-size="12" fill="#8A8880" baseline-shift="super">ANCHOR</text>
  </g>

  <!-- subtitle -->
  <g class="mono">
    <text x="24" y="126" font-size="12.5" fill="#8A8880" letter-spacing="0.02em">tamper-evident exact memory + collision-resistant associative + S3 Object Lock anchor</text>
  </g>

  <!-- contract line -->
  <g class="mono">
    <rect x="24" y="142" width="380" height="22" fill="#1E1E26" stroke="#2A2A35" stroke-width="1"/>
    <text x="32" y="157" font-size="11" fill="#E8E6E1">get(k) = v_set ∨ Err(Tamper)  •  verify(root) → s3_locked ∧ local_valid</text>
  </g>

  <!-- right stats -->
  <g class="mono">
    <rect x="440" y="78" width="336" height="86" fill="#1E1E26" stroke="#2A2A35" stroke-width="1"/>
    <text x="456" y="98" font-size="10" letter-spacing="0.1em" fill="#8A8880">SWSTM COLLISION — 10k / 2k — 5x OVERLOAD</text>
    <text x="456" y="118" font-size="12" fill="#E8E6E1">naive 19.84%  →  bucket-8 97.45%  →  hybrid 100%</text>
    <text x="456" y="136" font-size="10" fill="#8A8880">8016 collisions • 255 evictions (b8) • 0% silent wrong • 100% DR</text>
    <text x="456" y="152" font-size="10" fill="#00FF88">VERIFIED tests/test_swstm_collision.py</text>
  </g>

  <!-- bottom line -->
  <g class="mono">
    <text x="24" y="210" font-size="10" letter-spacing="0.06em" fill="#8A8880">FLIGHT RECORDER FOR 10B AGENTS • EU AI ACT ART 12 READY • 0 TAMPERED • ledger tip 0x4a2f…1291 • merkle root anchored</text>
    <text x="24" y="224" font-size="9" fill="#5A5852">exactmemory.recallspection • exact-first • never last-writer-wins • eigengrau #16161D</text>
    <!-- green tiny dot -->
    <circle cx="760" cy="216" r="3" fill="#00FF88"/>
    <text x="740" y="219" font-size="8" fill="#00FF88" text-anchor="end">LIVE</text>
  </g>

  <!-- grain overlay -->
  <rect width="800" height="240" filter="url(#grain)" opacity="0.035" pointer-events="none"/>
</svg>
