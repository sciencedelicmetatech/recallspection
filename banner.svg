<svg width="800" height="340" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Recallspection wordmark">
  <defs>
    <!-- Background gradient: deep navy to eigengrau -->
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0B1630"/>
      <stop offset="55%" stop-color="#0A0D1A"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>

    <!-- Metallic silver gradient for the wordmark -->
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#F4F6FA"/>
      <stop offset="22%" stop-color="#C5CEDB"/>
      <stop offset="48%" stop-color="#FFFFFF"/>
      <stop offset="62%" stop-color="#FFFFFF"/>
      <stop offset="78%" stop-color="#8E99A8"/>
      <stop offset="100%" stop-color="#4A5360"/>
    </linearGradient>

    <!-- Diagonal light streak -->
    <linearGradient id="streak" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3B7DD8" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#6FA8E8" stop-opacity="0.35"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="65%"  stop-color="#6FA8E8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B7DD8" stop-opacity="0"/>
    </linearGradient>

    <!-- Bright flare at intersection -->
    <radialGradient id="flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="18%"  stop-color="#D6ECFF" stop-opacity="0.75"/>
      <stop offset="50%"  stop-color="#6FA8E8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6FA8E8" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft glow behind wordmark -->
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Blur for the streak -->
    <filter id="streakBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <!-- Cinzel import; falls back to serif if unavailable -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&amp;display=swap');
      .wordmark {
        font-family: 'Cinzel', 'Trajan Pro', 'Palatino Linotype', 'Times New Roman', serif;
        font-weight: 700;
        letter-spacing: 0.03em;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="340" fill="url(#bg)"/>

  <!-- Wordmark, metallic gradient, soft glow -->
  <text x="400" y="196" text-anchor="middle" class="wordmark"
        font-size="74" fill="url(#metal)" filter="url(#softGlow)">RECALLSPECTION</text>

  <!-- Single diagonal streak, bottom-left to top-right -->
  <g filter="url(#streakBlur)">
    <line x1="60" y1="340" x2="740" y2="0"
          stroke="url(#streak)" stroke-width="14" opacity="0.35"/>
    <line x1="60" y1="340" x2="740" y2="0"
          stroke="url(#streak)" stroke-width="3" opacity="0.95"/>
  </g>

  <!-- Bright flare at the crossing point -->
  <circle cx="400" cy="170" r="70" fill="url(#flare)"/>
  <circle cx="400" cy="170" r="6"  fill="#FFFFFF" opacity="0.95"/>
</svg>
