[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recallspection"
version = "18.0.0"
description = "Tamper-evident exact memory for autonomous AI agents. get(k) returns the stored value or Err(Tamper); never silent wrong data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later OR LicenseRef-RIL-1.0" }
authors = [
    { name = "Eliam Raell", email = "eliam@sciencedelicmetatech.com" }
]
maintainers = [
    { name = "Sciencedelic Metatech", email = "maintainers@sciencedelicmetatech.com" }
]
keywords = [
    "agent memory",
    "tamper-evident storage",
    "storage integrity",
    "AI agent security",
    "HMAC",
    "transparency log",
    "rollback detection",
    "S3 Object Lock",
    "exact memory"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "sentence-transformers>=2.2",
    "scikit-learn>=1.3",
    "numpy>=1.24",
]
anchor = [
    "boto3>=1.28",
]
postgres = [
    "psycopg2-binary>=2.9",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.8",
    "build>=1.0",
]
all = [
    "torch>=2.0",
    "sentence-transformers>=2.2",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "boto3>=1.28",
    "psycopg2-binary>=2.9",
]

[project.urls]
Homepage = "https://github.com/sciencedelicmetatech/recallspection"
Repository = "https://github.com/sciencedelicmetatech/recallspection"
Issues = "https://github.com/sciencedelicmetatech/recallspection/issues"
Discussions = "https://github.com/sciencedelicmetatech/recallspection/discussions"
Changelog = "https://github.com/sciencedelicmetatech/recallspection/blob/main/CHANGELOG.md"
Documentation = "https://github.com/sciencedelicmetatech/recallspection/blob/main/README.md"
Paper = "https://doi.org/10.5281/zenodo.23078584"

[project.scripts]
recallspection = "recallspection.__main__:main"

[tool.setuptools]
packages = ["recallspection", "exactmemory_recallspection"]
include-package-data = true

[tool.setuptools.package-data]
recallspection = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=recallspection --cov-report=term-missing"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "demos",
    "examples",
    "dashboard.py",
    "showcase.py",
    "stress_test_50k.py",
    "test_a_51hop_proof.py",
    "index.html",
]

[tool.ruff.lint]
select = [
    "E9",   # syntax errors
    "F63",  # invalid print/assert syntax
    "F7",   # syntax errors in statements
    "F82",  # undefined names
]
ignore = [
    "E501",  # line too long
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = false
disallow_untyped_defs = false
check_untyped_defs = false
no_implicit_optional = false

[tool.coverage.run]
source = ["recallspection"]
omit = [
    "tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]