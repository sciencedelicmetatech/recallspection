name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (syntax errors only)
        run: ruff check . --select E9,F63,F7,F82

      - name: Run test suite
        run: pytest tests/ -v --cov=recallspection --cov-report=term-missing
        continue-on-error: true

      - name: Integrity attack suite
        run: python tests/test_integrity_attack_suite.py
        continue-on-error: true

      - name: SWSTM collision stress test
        run: python tests/test_swstm_collision.py
        continue-on-error: true

  anchor-smoke:
    name: S3 Anchor smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,anchor]"

      - name: Import check
        run: python -c "from recallspection.anchor import anchor_root, compute_merkle_root, RemoteAnchorS3; print('anchor import ok')"

      - name: Merkle root on a synthetic log
        run: |
          python - <<'PY'
          import tempfile, json, time
          from pathlib import Path
          from recallspection.anchor import compute_merkle_root
          with tempfile.TemporaryDirectory() as d:
              p = Path(d) / "transparency.log"
              with p.open("w") as f:
                  for i in range(5):
                      f.write(json.dumps({"i": i, "ts": int(time.time())}) + "\n")
              root = compute_merkle_root(p)
              assert root.startswith("0x") and len(root) == 66, root
              print("merkle root ok:", root)
          PY

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7