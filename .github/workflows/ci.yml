name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install deps (no PyPI yet)
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov numpy scikit-learn
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        # exactmemory not on PyPI yet - install from your other repo
        pip install git+https://github.com/sciencedelicmetatech/exactmemory.recallspection.git
        pip install -r requirements.txt || true
        # install THIS repo - must not use || true, let it fail if broken
        pip install -e .
    - name: Run YOUR test file
      run: |
        pytest tests/test_swstm.py -v --tb=short
    - name: Check import
      run: |
        python -c "from recallspection.swstm import SWSTMEngine; print('OK')"