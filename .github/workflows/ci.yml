name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies (CI-safe)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || echo "no requirements.txt"
        pip install exactmemory-recallspection
        pip install pytest pytest-cov fastapi uvicorn torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e .

    - name: Run integrity attack suite (self-contained, no deps)
      run: |
        python tests/test_integrity_attack_suite.py

    - name: Run collision stress test
      run: |
        python tests/test_swstm_collision.py

    - name: Run pytest
      run: |
        pytest tests/ -v --tb=short || pytest tests/test_integrity_attack_suite.py tests/test_swstm_collision.py -v

    - name: Check ExactMemory core loads
      run: |
        python -c "from recallspection import ExactMemory; print('ExactMemory OK')"
