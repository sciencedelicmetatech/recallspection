name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  # ============================================================
  # Product tests: pytest, lint, build
  # ============================================================
  test:
    name: Product tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # TODO: enable after type annotation cleanup
      # - name: Type check
      #   run: mypy recallspection

      - name: Pytest
        run: pytest -q

      - name: Build package
        run: python -m build

  # ============================================================
  # Verification artifacts: Python existence + Z3 structural
  # ============================================================
  verification:
    name: Verification artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install z3
        run: |
          python -m pip install --upgrade pip
          pip install z3-solver

      - name: Combined 4-in-1 (Papers 2-3)
        run: python verification/necessity.py

      - name: Attribution existence (Paper 6)
        run: python verification/attribution_necessity.py

      - name: Attribution structural (Paper 6)
        run: python verification/z3_attribution_necessity.py

      # --- Pending artifacts. Uncomment as each file is added. ---
      # - name: Read-path existence (Paper 4)
      #   run: python verification/read_path_necessity.py
      # - name: Read-path structural (Paper 4)
      #   run: python verification/z3_read_path_necessity.py
      # - name: Contextual integrity existence (Paper 7)
      #   run: python verification/ci_necessity.py
      # - name: Contextual integrity structural (Paper 7)
      #   run: python verification/z3_ci_necessity.py
      # - name: Stack existence (Paper 8)
      #   run: python verification/stack_necessity.py
      # - name: Stack structural (Paper 8)
      #   run: python verification/z3_stack_necessity.py

  # ============================================================
  # Lean 4 proofs: deterministic core, no sorry
  # ============================================================
  lean:
    name: Lean proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Lake build
        uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean/lake-manifest.json', 'lean/lean-toolchain') }}
          restore-keys: |
            lake-${{ runner.os }}-

      - name: Check toolchain pin
        run: |
          actual=$(cat lean/lean-toolchain | tr -d '[:space:]')
          expected="leanprover/lean4:v4.11.0"
          if [ "$actual" != "$expected" ]; then
            echo "Toolchain mismatch: expected $expected, got $actual"
            exit 1
          fi

      - name: Build
        working-directory: lean
        run: lake build

  # ============================================================
  # S3 anchor smoke test (manual dispatch only, uses secrets)
  # ============================================================
  anchor-smoke:
    name: S3 anchor smoke test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[anchor]"

      - name: Smoke test
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION:            ${{ secrets.AWS_REGION }}
          RECALLSPECTION_BUCKET: ${{ secrets.RECALLSPECTION_BUCKET }}
        run: python scripts/anchor_smoke.py