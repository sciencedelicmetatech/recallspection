name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies (CI-safe)
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov numpy
        # Install PyTorch CPU version to keep CI fast and small
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        # Install main repo requirements
        pip install -r requirements.txt || true
        # FIX: Install ExactMemory directly from GitHub (since it's not on PyPI yet)
        pip install git+https://github.com/sciencedelicmetatech/exactmemory.recallspection.git
        # Install the main repo itself in editable mode
        pip install -e . || true

    - name: Run pytest
      run: |
        pytest tests/test_swstm.py -v --cov=recallspection

    - name: Check ExactMemory core loads
      run: |
        python -c "from recallspection import ExactMemory; print('ExactMemory OK')"
