name: conformance

on:
  push:
    branches: [main]
    paths:
      - "recallspection/conformance/**"
      - "recallspection/api.py"
      - "exactmemory_recallspection/**"
  pull_request:
  workflow_dispatch:

jobs:
  agmi:
    name: agmi storage-edit conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run conformance suite
        run: python recallspection/conformance/agmi_selfcheck.py