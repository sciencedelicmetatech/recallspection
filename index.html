<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#16161d">
    <meta name="color-scheme" content="dark">
    <title>Recallspection – Exact Memory for AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #16161d;
            --fg: #b0b0c0;
            --fg-dim: #a0a0b8;
            --neon: #39ff14;
            --neon-dim: rgba(57, 255, 20, 0.2);
            --grid: 40px;

            --safe-top: env(safe-area-inset-top, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);

            /* fluid scale — smallest phone to 4K */
            --pad-x: clamp(1rem, 4vw, 4rem);
            --pad-y: clamp(1.5rem, 4vh, 4rem);
            --gap: clamp(1rem, 2.5vh, 2.5rem);
            --content-max: 60rem;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            scroll-behavior: smooth;
            height: 100%;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'Cinzel', serif;
            font-weight: 400;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding:
                calc(var(--pad-y) + var(--safe-top))
                calc(var(--pad-x) + var(--safe-right))
                calc(var(--pad-y) + var(--safe-bottom))
                calc(var(--pad-x) + var(--safe-left));
            position: relative;
            overflow-x: hidden;
            overflow-wrap: break-word;
            text-rendering: optimizeLegibility;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(57, 255, 20, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57, 255, 20, 0.03) 1px, transparent 1px);
            background-size: var(--grid) var(--grid);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: var(--content-max);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--gap);
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: clamp(2.2rem, 8vw + 1rem, 7rem);
            letter-spacing: 0.06em;
            line-height: 1.05;
            color: #ffffff;
            text-shadow:
                0 0 10px rgba(255, 255, 255, 0.4),
                0 0 20px rgba(255, 255, 255, 0.2),
                0 0 40px rgba(255, 255, 255, 0.1);
            overflow-wrap: break-word;
            word-break: break-word;
            text-wrap: balance;
        }

        .tagline {
            font-family: 'Cinzel', serif;
            font-weight: 400;
            font-size: clamp(0.7rem, 1.2vw + 0.4rem, 1.4rem);
            letter-spacing: clamp(0.12em, 0.4vw + 0.08em, 0.3em);
            text-transform: uppercase;
            color: var(--neon);
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
            border-bottom: 1px solid var(--neon-dim);
            padding-bottom: 0.85rem;
            display: inline-block;
            max-width: 100%;
            text-wrap: balance;
        }

        .description {
            font-family: 'Cinzel', serif;
            font-weight: 400;
            font-size: clamp(0.9rem, 0.8vw + 0.65rem, 1.2rem);
            line-height: 1.75;
            color: var(--fg-dim);
            max-width: 42ch;
            letter-spacing: 0.03em;
            text-wrap: pretty;
        }

        .description strong {
            color: var(--neon);
            font-weight: 700;
        }

        /* block-level break controlled by width, not hardcoded */
        .description br {
            display: none;
        }

        @media (max-width: 600px) {
            .description br {
                display: inline;
            }
        }

        .cta {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: clamp(0.9rem, 0.6vw + 0.75rem, 1.1rem);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 0.9rem 2rem;
            background: transparent;
            color: var(--neon);
            border: 2px solid var(--neon);
            border-radius: 0;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            min-width: 200px;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.15);
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .cta::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--neon);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s ease;
            z-index: -1;
        }

        .cta:focus-visible {
            color: var(--bg);
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.3);
            outline: 2px solid var(--neon);
            outline-offset: 4px;
        }

        .cta:focus-visible::before {
            transform: scaleX(1);
            transform-origin: left;
        }

        /* hover only on devices that actually hover (not iPad) */
        @media (hover: hover) and (pointer: fine) {
            .cta:hover {
                color: var(--bg);
                box-shadow: 0 0 30px rgba(57, 255, 20, 0.3);
            }
            .cta:hover::before {
                transform: scaleX(1);
                transform-origin: left;
            }
        }

        .status {
            font-family: 'Cinzel', serif;
            font-weight: 400;
            font-size: clamp(0.6rem, 0.4vw + 0.5rem, 0.8rem);
            letter-spacing: 0.18em;
            color: var(--neon);
            opacity: 0.5;
            border-top: 1px solid rgba(57, 255, 20, 0.1);
            padding-top: 1.25rem;
            width: 100%;
            max-width: 32rem;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.6rem 1.4rem;
            text-transform: uppercase;
        }

        .status span {
            color: var(--neon);
            opacity: 0.75;
            white-space: nowrap;
        }

        .status .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--neon);
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        /* ---- phone ---- */
        @media (max-width: 480px) {
            :root {
                --grid: 28px;
            }
            body {
                justify-content: flex-start;
            }
            .cta {
                width: 100%;
                max-width: 22rem;
            }
            .status {
                gap: 0.5rem 0.9rem;
                letter-spacing: 0.12em;
            }
        }

        /* ---- tablet portrait / iPad mini ---- */
        @media (min-width: 481px) and (max-width: 900px) {
            :root {
                --grid: 32px;
            }
        }

        /* ---- iPad landscape / small laptop ---- */
        @media (min-width: 901px) and (max-width: 1400px) {
            :root {
                --grid: 44px;
            }
        }

        /* ---- large desktop / 4K ---- */
        @media (min-width: 1401px) {
            :root {
                --grid: 52px;
            }
            body {
                padding: 5rem 4rem;
            }
        }

        /* ---- short viewport (laptops 13", landscape phones) ---- */
        @media (max-height: 620px) and (min-width: 481px) {
            body {
                justify-content: flex-start;
                padding-top: 2.5rem;
                padding-bottom: 2.5rem;
            }
            .logo {
                font-size: clamp(2rem, 6vw, 3.5rem);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1 class="logo">Recallspection</h1>
        <p class="tagline">Exact Memory. Zero Hallucinations.</p>
        <p class="description">
            The first dual&#8209;core memory for AI agents.<br>
            <strong>Cryptographic</strong> precision &middot;
            <strong>Neural</strong> fuzziness &middot;
            <strong>100%</strong> exact recall.
        </p>
        <a href="/docs" target="_blank" rel="noopener" class="cta">Get Your API Key</a>
        <div class="status" role="status" aria-live="polite">
            <span><span class="dot" aria-hidden="true"></span>LIVE</span>
            <span>v18.0.0</span>
            <span>&#8734; FACTS</span>
        </div>
    </main>
</body>
</html>
